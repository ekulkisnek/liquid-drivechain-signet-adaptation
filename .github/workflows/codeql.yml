name: CodeQL
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '31 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # No-build analysis supplements, not replaces, compiled consensus tests.
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          category: /language:${{ matrix.language }}
