name: Build historical Elements release binaries

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit (historical bf8e9e1e recipes only)
        required: true
      release_tag:
        description: Existing draft release tag elements-<first 8 source SHA characters>
        required: true

permissions:
  contents: read

concurrency:
  group: elements-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            script: build_linux_bf8e9e1e.sh
            package: liquid-signet-elements-bf8e9e1e-linux-x86_64.tar.gz
            packages: ""
          - name: Windows x86_64
            script: build_windows_bf8e9e1e.sh
            package: liquid-signet-elements-bf8e9e1e-windows-x86_64.zip
            packages: g++-mingw-w64-x86-64-posix

    steps:
      - name: Validate explicit historical release identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" == "elements-${SOURCE_SHA:0:8}" ]]
          # These recipes predate the pinned SP1 verifier. Never label them as V11.
          [[ "$SOURCE_SHA" == bf8e9e1e5a6453b3a0573ff57cf9c92b2b3afe2b ]]

      - name: Check out release recipes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: recipes
          persist-credentials: false

      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false

      - name: Install build dependencies
        env:
          EXTRA_PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison bsdmainutils build-essential cmake curl \
            file git jq libtool patch pkg-config python3 python3-setuptools \
            unzip zip $EXTRA_PACKAGES

      - name: Build, test, and package
        env:
          REPO: ${{ github.workspace }}/source
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts
          LOG_DIR: ${{ github.workspace }}/release-logs
          JOBS: "2"
          SCRIPT: ${{ matrix.script }}
        run: '"$GITHUB_WORKSPACE/recipes/contrib/release/$SCRIPT"'

      - name: Verify package checksum
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          sha256sum "artifacts/$PACKAGE"
          file "artifacts/$PACKAGE"

      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ matrix.script }}
          path: release-logs/
          if-no-files-found: warn

      - name: Stage package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package-${{ matrix.script }}
          path: artifacts/${{ matrix.package }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: elements-release
    permissions:
      contents: write
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-package-*
          merge-multiple: true
          path: artifacts
      - name: Verify draft and immutable source tag, then upload without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" == "elements-${SOURCE_SHA:0:8}" ]]
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object)
          for depth in 1 2 3 4; do
            [[ "$(jq -r .type <<< "$object")" == tag ]] || break
            tag_sha=$(jq -r .sha <<< "$object")
            object=$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq .object)
          done
          [[ "$(jq -r .type <<< "$object")" == commit ]]
          [[ "$(jq -r .sha <<< "$object")" == "$SOURCE_SHA" ]]
          gh release upload "$RELEASE_TAG" artifacts/*
