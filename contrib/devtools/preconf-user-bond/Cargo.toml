[package]
name = "elementsplus-preconf"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"
description = "Experimental Simplicity double-authorization collateral covenant; not a deployed preconfirmation protocol"

[dependencies]
simplicityhl = "=0.7.2"
serde_json = "=1.0.145"
serde = { version = "=1.0.228", features = ["derive"] }
hex = "=0.4.3"
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"], optional = true }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "=0.3.31", features = ["sink"], optional = true }
getrandom = { version = "=0.2.16", optional = true }
url = { version = "=2.5.7", optional = true }

[features]
relay = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:getrandom", "dep:url"]

[[bin]]
name = "preconf-relay"
path = "src/bin/preconf-relay.rs"
required-features = ["relay"]

[lints.rust]
unsafe_code = "forbid"
